<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>سيرتيفاي | Seertify — مسارك المهني، بذكاء.</title>
<meta http-equiv="refresh" content="2;url=https://drawing-wal-tattoo-relevant.trycloudflare.com">
<style>
:root{--paper:#F5F0E4;--ink:#13100E;--accent:#C9FF4E;--coral:#FF5A4E;--muted:#6B6255}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);display:grid;place-items:center;min-height:100vh;
 font-family:"Tajawal",system-ui,-apple-system,"Segoe UI",sans-serif}
.b{text-align:center;padding:32px 24px;max-width:520px}
.mark{width:56px;height:56px;margin:0 auto 18px;border:2px solid var(--ink);border-radius:14px;background:var(--accent);
 display:grid;place-items:center;font-weight:800;font-size:24px;box-shadow:4px 4px 0 var(--ink)}
h1{margin:0 0 6px;font-size:26px;font-weight:800;letter-spacing:0}
small{display:block;font-size:10px;letter-spacing:3px;font-weight:700;opacity:.55;margin-bottom:14px}
p{margin:0 0 20px;line-height:1.95;color:var(--muted);font-weight:500}
a{display:inline-block;background:var(--ink);color:var(--paper);padding:13px 34px;border:2px solid var(--ink);
 border-radius:10px;text-decoration:none;font-weight:800;box-shadow:4px 4px 0 var(--coral);transition:.15s}
a:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--coral)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);border:1.5px solid var(--ink);
 margin-inline-end:8px;vertical-align:1px}
</style></head>
<body><div class="b">
  <div class="mark">س</div>
  <h1>سيرتيفاي</h1>
  <small>SEERTIFY</small>
  <p><span class="dot"></span>جارٍ تحويلك إلى المنصة…</p>
  <a href="https://drawing-wal-tattoo-relevant.trycloudflare.com">ابدأ الآن</a>
</div></body></html>
